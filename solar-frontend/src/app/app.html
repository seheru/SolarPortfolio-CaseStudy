<!-- Tüm sayfanın ortalayıcı kapsayıcısı -->
<div class="min-h-screen flex items-center justify-center p-4">
  
  <!-- Ana Kart (#201D24 rengi) -->
  <div class="flex flex-col md:flex-row w-full max-w-[1033px] h-[563px] bg-[#201D24] rounded-3xl overflow-hidden shadow-2xl relative">
    
   <!-- SOL TARAF (Oyun Alanın) -->
    <div class="hidden md:flex w-[310px] h-full relative items-center justify-center bg-no-repeat bg-cover bg-left"

    <!-- SAĞ TARAF: İç boşlukları (p-12) biraz azalttık, içeriği daha derli toplu yaptık -->

      <!-- Başlık (text-3xl yerine text-2xl yaptık) -->

        <!-- Şifre Kutusu -->
        <div class="relative">

          <div class="flex items-center gap-2.5">
              <input type="checkbox" class="w-4 h-4 accent-[#AA9DD6] rounded cursor-pointer border-gray-700 bg-transparent">
              <span class="text-gray-300 text-xs">Robot Olmadığınızı Kanıtlayın</span>
          </div>
          <div class="flex flex-col items-center">
            <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" class="w-6 opacity-80" alt="reCaptcha">
            <span class="text-[8px] text-gray-500 mt-0.5">reCAPTCHA</span>

        </div>

        <!-- Buton -->
        <button class="w-full bg-[#a390e4] hover:bg-[#8b78d1] text-white font-semibold rounded-xl py-3 mt-1 text-sm transition-colors shadow-lg">
